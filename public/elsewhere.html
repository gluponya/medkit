<!DOCTYPE html>
<!--
  Where a page of the app goes when a newer one takes the database over
  (index.web.js): the app is open in another window. The button opens it here
  again, and this time the other window comes here.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Medkit</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #eef3fe;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #2f3a4f;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 0 24px;
        box-sizing: border-box;
        text-align: center;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0;
      }
      button {
        font: inherit;
        font-size: 17px;
        font-weight: 600;
        color: #fff;
        background: #4a6cf7;
        border: 0;
        border-radius: 14px;
        padding: 14px 28px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Аптечка відкрита в іншому вікні</h1>
      <button id="here" type="button">Відкрити тут</button>
    </main>
    <script>
      if (!/^(uk|ru)/i.test(navigator.language)) {
        document.getElementById('title').textContent = 'Medkit is open in another window';
        document.getElementById('here').textContent = 'Open here';
      }
      document.getElementById('here').addEventListener('click', () => {
        window.location.replace('/' + window.location.hash);
      });
    </script>
  </body>
</html>
